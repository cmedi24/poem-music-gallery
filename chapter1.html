<main><div class="title"><span class="eyebrow">시와 함께 머무는 시간</span><h1>장애</h1><span class="rule" aria-hidden="true"></span></div>
<article class="poem" aria-label="장애, 이시형"><section class="verse first"><p>세상이 내가 너를 이겨냈다고 하여도</p><p>나는 너를 단 한 번도 극복한 적 없다</p><p>아무리 뿌리치려 애써봐도<br class="mobile"> 내 몸에 평생 철썩 붙어 다니는 너를</p><p>어떻게 이길 수가 있나</p></section><section class="verse second"><p>너 때문에 우는 날이 있어도</p><p>네가 있어도 웃는 날도 있더라</p></section><section class="verse third"><p>내가 해야 하는 것은</p><p>네가 붙어 있어도 웃기 위해</p><p>너와 함께 이 세상을<br class="mobile"> 극복하고 이겨야 되는 것이다</p></section></article>
